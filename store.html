<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин приложений</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14182a;--sub:#6b7289;--line:#e4e8f2;--accent:#2a5bff;--accent2:#7a3cff;--on:#fff;--chip:#e9edf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#181c2e;--text:#eef0fa;--sub:#98a0bc;--line:#262b42;--chip:#222740;--accent:#5b86ff}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#181c2e;--text:#eef0fa;--sub:#98a0bc;--line:#262b42;--chip:#222740;--accent:#5b86ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 8px;z-index:5}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;display:flex;align-items:center;gap:10px}
h1 img{width:36px;height:36px;border-radius:10px}
input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on)}
.banner{margin:12px 0 4px;border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.banner b{display:block;font-size:20px;margin-bottom:4px}
.banner span{opacity:.9}
h2{font-size:17px;margin:20px 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:16px;margin-bottom:8px;cursor:pointer}
.ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.ico.lg{width:80px;height:80px;border-radius:22px;font-size:36px}
.info{flex:1;min-width:0}
.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:none;min-width:96px;border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:var(--on);position:relative;overflow:hidden}
.btn.open{background:var(--chip);color:var(--accent)}
.btn.load{background:var(--chip);color:var(--text)}
.btn .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.sheet{position:fixed;inset:0;background:rgba(10,12,24,.55);display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.stats{display:flex;justify-content:space-around;padding:12px 0;margin:14px 0;border-block:1px solid var(--line);text-align:center}
.stats b{display:block;font-size:16px}.stats span{font-size:12px;color:var(--sub)}
.panel p{color:var(--sub);margin-bottom:14px}
.panel .btn{width:100%;padding:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0;font:inherit;font-size:12px;cursor:pointer}
nav button.on{color:var(--accent);font-weight:650}
nav i{display:block;font-style:normal;font-size:20px}
</style>
</head>

    <input id="q" type="search" placeholder="Поиск приложений и игр" aria-label="Поиск">
    <div class="chips" id="chips"></div>
  </header>
  <div id="banner" class="banner"><b>Подборка недели</b><span>Лучшие приложения для работы и отдыха</span></div>
  <div id="list"></div>
</div>
<nav><div>
  <button class="on" data-tab="all"><i>🏠</i>Главная</button>
  <button data-tab="games"><i>🎮</i>Игры</button>
  <button data-tab="mine"><i>📦</i>Мои</button>
</div></nav>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme); } catch(e){} }

var APPS = [
 {id:1,n:'Банк Онлайн',c:'Финансы',g:0,r:4.8,d:'12 млн',s:'64 МБ',t:'Переводы, платежи и накопления в одном приложении. Оплата по QR и СБП.',col:'#16a37f'},
 {id:2,n:'Карты и Навигатор',c:'Путешествия',g:0,r:4.7,d:'8 млн',s:'88 МБ',t:'Офлайн-карты, пробки и общественный транспорт в вашем городе.',col:'#2a5bff'},
 {id:3,n:'Маркет Плюс',c:'Покупки',g:0,r:4.6,d:'20 млн',s:'72 МБ',t:'Товары с доставкой, кэшбэк и отслеживание заказов.',col:'#e5484d'},
 {id:4,n:'Космо Рейс',c:'Игры',g:1,r:4.5,d:'3 млн',s:'210 МБ',t:'Аркада про полёты между планетами. Собирайте корабли и улучшайте их.',col:'#7a3cff'},
 {id:5,n:'Шахматы Про',c:'Игры',g:1,r:4.9,d:'5 млн',s:'45 МБ',t:'Партии с друзьями и компьютером, разбор ходов и ежедневные задачи.',col:'#14182a'},
 {id:6,n:'Музыка Плей',c:'Музыка',g:0,r:4.7,d:'15 млн',s:'55 МБ',t:'Миллионы треков, офлайн-режим и персональные подборки.',col:'#f08a24'},
 {id:7,n:'Заметки Лайт',c:'Работа',g:0,r:4.4,d:'1 млн',s:'18 МБ',t:'Быстрые заметки, списки дел и напоминания без лишнего.',col:'#d4a017'},
 {id:8,n:'Фитнес Дом',c:'Здоровье',g:0,r:4.6,d:'2 млн',s:'96 МБ',t:'Тренировки без оборудования и учёт активности по дням.',col:'#e0457b'},
 {id:9,n:'Башни и Драконы',c:'Игры',g:1,r:4.3,d:'4 млн',s:'340 МБ',t:'Стратегия в жанре tower defense с картами и боссами.',col:'#0e8a9e'}
];
var CATS = ['Все','Игры','Финансы','Покупки','Музыка','Работа','Здоровье','Путешествия'];
var state = {tab:'all',cat:'Все',q:'',inst:{}};
var prog = {};

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
try { var saved = JSON.parse(localStorage.getItem('inst')||'{}'); for (var k in saved) if (saved[k]==='done') state.inst[k]='done'; } catch(e){}
function save(){ try { localStorage.setItem('inst', JSON.stringify(state.inst)); } catch(e){} }

function btn(a){
  var s = state.inst[a.id];
  if (s==='done') return '<button class="btn open" data-act="open" data-id="'+a.id+'">Открыть</button>';
  if (s==='load') return '<button class="btn load" data-id="'+a.id+'">'+Math.round(prog[a.id]||0)+'%<span class="bar" style="width:'+(prog[a.id]||0)+'%"></span></button>';
  return '<button class="btn" data-act="get" data-id="'+a.id+'">Установить</button>';
}
function row(a){
  return '<div class="row" data-card="'+a.id+'"><div class="ico" style="background:'+a.col+'">'+esc(a.n[0])+'</div>'
   +'<div class="info"><div class="name">'+esc(a.n)+'</div><div class="meta">'+esc(a.c)+' · ★ '+a.r+' · '+a.s+'</div></div>'+btn(a)+'</div>';
}
function render(){
  var q = state.q.trim().toLowerCase();
  var items = APPS.filter(function(a){
    if (state.tab==='games' && !a.g) return false;
    if (state.tab==='mine' && state.inst[a.id]!=='done') return false;
    if (state.cat!=='Все' && a.c!==state.cat) return false;
    return !q || a.n.toLowerCase().indexOf(q)>-1 || a.c.toLowerCase().indexOf(q)>-1;
  });
  $('banner').style.display = (state.tab==='all' && !q && state.cat==='Все') ? '' : 'none';
  $('list').innerHTML = items.length ? items.map(row).join('')
    : '<div class="empty">'+(state.tab==='mine'?'Вы ещё ничего не установили':'Ничего не найдено. Попробуйте другой запрос')+'</div>';
  $('chips').innerHTML = CATS.map(function(c){return '<button class="chip'+(c===state.cat?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join('');
}
function install(id){
  state.inst[id]='load'; prog[id]=0; refresh();
  var t = setInterval(function(){
    prog[id] += 6 + Math.random()*10;
    if (prog[id] >= 100){ clearInterval(t); state.inst[id]='done'; save(); if (tg && tg.HapticFeedback) try{tg.HapticFeedback.notificationOccurred('success')}catch(e){} }
    refresh();
  }, 160);
}
function refresh(){
  render();
  var open = $('panel').getAttribute('data-id');
  if ($('sheet').classList.contains('show') && open) showApp(+open, true);
}
function showApp(id, keep){
  var a = APPS.filter(function(x){return x.id===id})[0];
  $('panel').setAttribute('data-id', id);
  $('panel').innerHTML = '<div class="top"><div class="ico lg" style="background:'+a.col+'">'+esc(a.n[0])+'</div><div class="info"><div class="name" style="font-size:20px">'+esc(a.n)+'</div><div class="meta">'+esc(a.c)+'</div></div></div>'
   +'<div class="stats"><div><b>★ '+a.r+'</b><span>Рейтинг</span></div><div><b>'+a.d+'</b><span>Загрузок</span></div><div><b>'+a.s+'</b><span>Размер</span></div></div>'
   +'<p>'+esc(a.t)+'</p>'+btn(a);
  $('sheet').classList.add('show');
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act],[data-cat],[data-tab],[data-card],#sheet');
  if (!el) return;
  if (el.dataset.act==='get'){ install(+el.dataset.id); return; }
  if (el.dataset.act==='open'){ var LINK='https://t.me/gordext'; if (tg && tg.openTelegramLink) tg.openTelegramLink(LINK); else window.open(LINK,'_blank'); return; }
  if (el.dataset.cat){ state.cat = el.dataset.cat; render(); return; }
  if (el.dataset.tab){
    state.tab = el.dataset.tab; state.cat='Все';
    document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on', b===el)});
    render(); return;
  }
  if (el.dataset.card){ showApp(+el.dataset.card); return; }
  if (el.id==='sheet' && e.target===el){ el.classList.remove('show'); $('panel').removeAttribute('data-id'); }
});
$('q').addEventListener('input', function(e){ state.q = e.target.value; render(); });
render();
</script>
</body>
</html>
